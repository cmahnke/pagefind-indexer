[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagefind-indexer"
version = "0.0.1"
authors = [
  { name="Christian Mahnke", email="pagefind@christianmahnke.de" },
]
description = "An experimental HTML indexer that generates a Pagefind search index using a external configuration."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "requests-ratelimiter>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "pagefind>=1.2.0",
]

[project.scripts]
pagefind-indexer = "indexer.pagefind_indexer:main"

[tool.setuptools.packages.find]
where = ["."]
